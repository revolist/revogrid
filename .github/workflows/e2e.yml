name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      exploratory_mode:
        type: string
        required: true
      exploratory_seeds:
        type: string
        default: ''

concurrency:
  group: ci-e2e-${{ github.ref }}-${{ inputs.exploratory_mode || 'regression' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        id: playwright
        timeout-minutes: 20
        shell: bash
        env:
          REVOGRID_QA: ${{ inputs.exploratory_mode != '' && '1' || '0' }}
          EXPLORATORY_MODE: ${{ inputs.exploratory_mode }}
          REVOGRID_QA_SEEDS: ${{ inputs.exploratory_seeds }}
        run: |
          set -o pipefail
          args=()
          if [[ "$REVOGRID_QA" == 1 ]]; then
            args+=(e2e/exploratory.spec.ts --workers=4)
            if [[ "$EXPLORATORY_MODE" == rotating ]]; then
              REVOGRID_QA_SEEDS=$(node -p 'const week = Math.floor(Date.now() / 604800000); Array.from({ length: 32 }, (_, i) => week * 32 + i).join(",")')
              export REVOGRID_QA_SEEDS
            fi
            echo "Exploratory seeds: ${REVOGRID_QA_SEEDS:-fixed corpus}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          npm run test:e2e -- "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/playwright-run.log"
          if [[ ! -s playwright-results.json ]]; then
            echo "::error::Playwright exited successfully without producing playwright-results.json"
            exit 1
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f playwright-results.json ]; then
            node --input-type=commonjs <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const { errors, stats } = require('./playwright-results.json');
          const { expected, unexpected, skipped, flaky, duration } = stats;
          console.log(`Passed ${expected}, failed ${unexpected}, skipped ${skipped}, passed on retry ${flaky}. Duration ${(duration / 1000).toFixed(2)} s.`);
          for (const error of errors) {
            const message = error.message ?? error.stack ?? 'Unknown runner error';
            const kind = /config\.webServer|waiting.*webServer/i.test(message) ? 'Web server startup' : 'Runner';
            console.log(`${kind} error`);
            console.log('~~~~text');
            console.log(message);
            console.log('~~~~');
          }
          JS
          else
            echo "Playwright did not produce a results file. Test step outcome is ${{ steps.playwright.outcome }}." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`$GITHUB_REF_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`$GITHUB_SHA\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | \`$RUNNER_OS\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright execution evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-results.json
            ${{ runner.temp }}/playwright-run.log
            test-results/
