name: Unit

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: jest
        shell: bash
        run: |
          set -o pipefail
          npm test -- --runInBand --json --outputFile=jest-results.json 2>&1 | tee jest-run.log
          if [[ ! -s jest-results.json ]]; then
            echo "::error::Jest exited successfully without producing jest-results.json"
            exit 1
          fi
          node -e "if (!require('./jest-results.json').success) process.exit(1)"

      - name: Build hydrate output
        run: npm run build

      - name: Check hydrate declarations
        run: npm run test:hydrate

      - name: Check packed CommonJS and ESM entry points
        run: npm run test:package-formats

      - name: Write job summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f jest-results.json ]; then
            TOTAL=$(node -p "require('./jest-results.json').numTotalTests")
            PASSED=$(node -p "require('./jest-results.json').numPassedTests")
            FAILED=$(node -p "require('./jest-results.json').numFailedTests")
            SKIPPED=$(node -p "require('./jest-results.json').numPendingTests")
            SUITES=$(node -p "require('./jest-results.json').numTotalTestSuites")
            FAILED_SUITES=$(node -p "require('./jest-results.json').numFailedTestSuites")
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| 📦 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed suites | $FAILED_SUITES |" >> $GITHUB_STEP_SUMMARY
            echo "| 🗂️ Suites | $SUITES |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| | |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Branch | \`$GITHUB_REF_NAME\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | \`$GITHUB_SHA\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Jest did not produce a results file. Test step outcome is ${{ steps.jest.outcome }}." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Jest evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jest-results
          path: |
            jest-results.json
            jest-run.log
          retention-days: 14
          if-no-files-found: ignore
