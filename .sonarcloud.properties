# CI-based SonarScanner configuration; automatic analysis uses .sonarcloud.properties.
sonar.exclusions=e2e/**,test/**,docs/**,packages/**,pdf/**,formats/**,scripts/**

# Stencil JSX uses class, so React's unknown-property rule does not apply.
sonar.issue.ignore.multicriteria=stencilJsx,stencilMethods,sequentialAwait
sonar.issue.ignore.multicriteria.stencilJsx.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.stencilJsx.resourceKey=src/**/*.tsx

# Stencil public @Method APIs must return promises, even for synchronous getters.
sonar.issue.ignore.multicriteria.stencilMethods.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.stencilMethods.resourceKey=src/components/**/*.tsx

# Sequential awaits support browser yielding, cancellation, and ordered scroll updates.
sonar.issue.ignore.multicriteria.sequentialAwait.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.sequentialAwait.resourceKey=src/**
