<!DOCTYPE html>
<html dir="ltr" lang="en" data-theme="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual reactive data grid spreadsheet component</title>
  <link rel="stylesheet" href="./revo-ui/styles.css" />
  <link rel="stylesheet" href="./revo-ui/dropdown.css" />
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="./controller.js"></script>
  <script type="module" src="/build/revo-grid.esm.js"></script>
  <script nomodule src="/build/revo-grid.js"></script>
</head>

<body>
  <aside class="demo-sidebar" aria-label="Grid controls">
    <section>
      <h2 id="data-label">Data</h2>
      <div class="demo-data-actions">
        <div id="data-picker"></div>
        <button type="button" class="rv-button" onclick="exportGrid()">Export CSV</button>
      </div>
    </section>

    <section>
      <h2 id="theme-label">Theme</h2>
      <div id="theme-picker"></div>
    </section>

    <section>
      <h2 id="pin-label">Pin</h2>
      <div id="pin-picker"></div>
    </section>

    <section>
      <h2 id="filter-label">Filter</h2>
      <div id="filter-picker"></div>
    </section>

    <section>
      <h2 id="sorting-label">Sorting</h2>
      <div id="sorting-picker"></div>
    </section>

    <section>
      <h2 id="row-grouping-label">Row grouping</h2>
      <div id="row-grouping-picker"></div>
      <p>Click a group cell to focus it. Paste text into the note cell, then copy it to another cell.</p>
    </section>

    <section>
      <h2 id="column-grouping-label">Column grouping</h2>
      <div id="column-grouping-picker"></div>
    </section>

    <section>
      <h2>Layout</h2>
      <div class="demo-actions">
        <button type="button" class="rv-button" onclick="scrollToCol(30)">Scroll to X30(AE)</button>
        <button type="button" class="rv-button" onclick="setEdit(30, 1)">Edit X2:Y31</button>
        <button type="button" class="rv-button" onclick="setRowSize(50)">Row sizes 50px</button>
        <button type="button" class="rv-button" onclick="setCustomRowSizes()">Custom row sizes</button>
      </div>
      <div class="demo-toggles">
        <label><input class="rv-checkbox" type="checkbox" onchange="setRtl(event.target.checked)" />RTL</label>
        <label><input class="rv-checkbox" type="checkbox" checked
            onchange="showRowHeaders(event.target.checked)" />Row headers</label>
        <label><input class="rv-checkbox" type="checkbox"
            onchange="timerUpdate(event.target.checked, 2)" />Refresh 2s</label>
        <label><input class="rv-checkbox" type="checkbox" checked
            onchange="toggleVisibility(event.target.checked)" />Toggle visibility</label>
      </div>
    </section>
  </aside>

  <main class="grid-holder">
    <div class="loader" role="status" style="display: none">Please wait. Cooking data...</div>
    <revo-grid can-move-columns apply-on-close="true" stretch="false"></revo-grid>
  </main>
</body>

</html>
